<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Parking Arena · History</title>
<link rel="stylesheet" href="css/common.css">
<link rel="stylesheet" href="css/history.css">
</head>
<body>

  <header class="topbar">
    <div class="topbar__left">
      <a class="topbar__brand" href="home.html"><span class="dot"></span> Parking Arena</a>
    </div>
    <div style="display:flex; gap:10px;">
      <button id="clear-btn" class="topbar__back" style="background:none; cursor:pointer; font-family:inherit;">Clear history</button>
      <a class="topbar__back" href="home.html">← Home</a>
    </div>
  </header>

  <main class="page">
    <p class="eyebrow">ENTRY / EXIT LOG</p>
    <h1>History</h1>

    <div id="status-msg" class="status-msg" hidden></div>
    <div id="info-msg" class="status-msg" hidden></div>

    <div class="panel">
      <table>
        <thead>
          <tr><th>Time</th><th>UID</th><th>Event</th><th>Fee</th></tr>
        </thead>
        <tbody id="logs-body">
          <tr><td colspan="4" class="empty-row">Loading...</td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/history.js"></script>
</body>
</html>
